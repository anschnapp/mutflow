org.gradle.jvmargs=-Xmx2g

# mutflow gives every native target a second, instrumented compilation whose
# source set deliberately depends on the target's default source set (that is
# what keeps production binaries free of instrumentation while the mutated
# test binary compiles the exact same sources). KGP warns about such edges;
# this suppresses only that specific diagnostic.
kotlin.suppressGradlePluginWarnings=KotlinSourceSetDependsOnDefaultCompilationSourceSet
